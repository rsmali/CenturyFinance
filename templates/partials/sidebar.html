<aside
  class="w-full md:w-72 bg-[#F9F9F6] border-r border-[#EAEAE5] flex flex-col shrink-0 md:h-screen md:sticky md:top-0 z-40">

  <!-- Brand Header (from Screenshot 0) -->
  <div class="px-6 py-5 border-b border-[#EAEAE5]/80 flex items-center justify-between">
    <div>
      <h1 class="font-serif-title text-xl font-bold text-century-charcoal tracking-tight whitespace-nowrap">Century
        Finance</h1>
      <p class="text-xs text-century-muted font-normal mt-0.5 whitespace-nowrap">Gestion de Patrimoine & Finances</p>
    </div>
    <!-- Mobile hamburger -->
    <button class="md:hidden text-century-muted hover:text-century-charcoal p-1" onclick="toggleMobileMenu()">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
      </svg>
    </button>
  </div>

  <!-- Workspace / Account Switcher -->
  <div class="px-4 py-3 border-b border-[#EAEAE5] bg-[#FAF9F5]/60 flex items-center space-x-1.5">
    <div class="relative flex-1">
      <button onclick="toggleWorkspaceDropdown(event)" id="workspace-switcher-btn"
        class="w-full flex items-center justify-between px-3 py-2 rounded-xl bg-white border border-[#EAEAE5] hover:border-[#CBD5E1] transition shadow-xs text-left">
        <div class="flex items-center space-x-2.5 truncate">
          <span id="active-ws-icon" class="text-base shrink-0">🏦</span>
          <div class="truncate">
            <span id="active-ws-name" class="block text-xs font-bold text-century-charcoal truncate">Compte
              Principal</span>
            <span id="active-ws-count" class="block text-[10px] text-century-muted">Relevés bancaires</span>
          </div>
        </div>
        <svg class="w-3.5 h-3.5 text-century-muted shrink-0 ml-1.5" fill="none" stroke="currentColor"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <!-- Dropdown Menu -->
      <div id="workspace-dropdown-menu"
        class="hidden absolute top-full left-0 right-0 mt-1.5 bg-white border border-[#EAEAE5] rounded-xl shadow-xl z-50 p-1.5 space-y-1">
        <div class="px-2.5 py-1 text-[10px] font-semibold text-century-muted uppercase tracking-wider">Espaces & Comptes
        </div>
        <div id="workspace-dropdown-items" class="space-y-0.5 max-h-48 overflow-y-auto">
          <!-- Dynamically populated -->
        </div>
        <div class="pt-1 border-t border-[#EAEAE5] space-y-0.5">
          <button onclick="openCreateWorkspaceModal()"
            class="w-full flex items-center space-x-2 px-2.5 py-2 rounded-lg text-xs font-semibold text-[#2D5A3C] hover:bg-[#E8F0EC] transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            <span>+ Nouvel Espace / Compte</span>
          </button>
          <button onclick="openWorkspaceSettingsModal()"
            class="w-full flex items-center space-x-2 px-2.5 py-2 rounded-lg text-xs font-semibold text-century-charcoal hover:bg-[#FAF9F6] transition">
            <span>⚙️ Paramètres du Profil & Règles</span>
          </button>
        </div>
      </div>
    </div>
    <button onclick="openWorkspaceSettingsModal()" title="Paramètres du profil de compte"
      class="p-2.5 rounded-xl bg-white border border-[#EAEAE5] hover:border-[#CBD5E1] text-century-muted hover:text-century-charcoal transition shadow-xs shrink-0">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    </button>
  </div>

  <!-- Navigation Menu (Exact layout & items from Screenshots) -->
  <nav id="sidebar-nav" class="flex-1 px-4 py-5 space-y-1.5 overflow-y-auto">

    <!-- Vue d'ensemble (Financial Overview) -->
    <button onclick="switchView('overview')" id="nav-overview"
      class="w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm text-[#4A5550] hover:bg-[#EFEFE9] hover:text-century-charcoal transition nav-item-active">
      <svg class="w-4 h-4 text-[#4A5550] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span class="font-medium whitespace-nowrap">Vue d'ensemble</span>
    </button>

    <!-- Simulateur de Budget -->
    <button onclick="switchView('budget')" id="nav-budget"
      class="w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm text-[#4A5550] hover:bg-[#EFEFE9] hover:text-century-charcoal transition">
      <svg class="w-4 h-4 text-[#4A5550] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
          d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
      </svg>
      <span class="font-medium whitespace-nowrap">Simulateur de Budget</span>
    </button>

    <!-- Machine Temporelle (Time Machine) -->
    <button onclick="switchView('timemachine')" id="nav-timemachine"
      class="w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm text-[#4A5550] hover:bg-[#EFEFE9] hover:text-century-charcoal transition">
      <svg class="w-4 h-4 text-[#4A5550] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
          d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span class="font-medium whitespace-nowrap">Machine Temporelle</span>
      <span id="nav-patterns-badge"
        class="ml-auto text-[11px] px-2 py-0.2 rounded-full bg-[#E8F0EC] text-[#2D5A3C] font-semibold shrink-0">6</span>
    </button>

    <!-- Analyse des Catégories (Category Analysis) -->
    <button onclick="switchView('categories')" id="nav-categories"
      class="w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm text-[#4A5550] hover:bg-[#EFEFE9] hover:text-century-charcoal transition">
      <svg class="w-4 h-4 text-[#4A5550] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
          d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      <span class="font-medium whitespace-nowrap">Analyse des Catégories</span>
    </button>

    <!-- Import de Relevés (Document Upload) -->
    <button onclick="switchView('upload')" id="nav-upload"
      class="w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm text-[#4A5550] hover:bg-[#EFEFE9] hover:text-century-charcoal transition">
      <svg class="w-4 h-4 text-[#4A5550] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
          d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
      </svg>
      <span class="font-medium whitespace-nowrap">Import de Relevés</span>
    </button>

    <!-- Journal des Opérations (Transaction Review) -->
    <button onclick="switchView('transactions')" id="nav-transactions"
      class="w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm text-[#4A5550] hover:bg-[#EFEFE9] hover:text-century-charcoal transition">
      <svg class="w-4 h-4 text-[#4A5550] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
      </svg>
      <span class="font-medium whitespace-nowrap">Journal des Opérations</span>
      <span id="nav-tx-count"
        class="ml-auto text-xs px-2 py-0.5 rounded-full bg-[#EAEAE5] text-[#555E58] font-mono shrink-0">0</span>
    </button>

    <!-- Gestion des Relevés (File Management) -->
    <button onclick="switchView('files')" id="nav-files"
      class="w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm text-[#4A5550] hover:bg-[#EFEFE9] hover:text-century-charcoal transition">
      <svg class="w-4 h-4 text-[#4A5550] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
          d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
      <span class="font-medium whitespace-nowrap">Gestion des Relevés</span>
    </button>

    <!-- Règles & Mots-clés (Rules & Keywords) -->
    <button onclick="switchView('rules')" id="nav-rules"
      class="w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm text-[#4A5550] hover:bg-[#EFEFE9] hover:text-century-charcoal transition">
      <svg class="w-4 h-4 text-[#4A5550] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      <span class="font-medium whitespace-nowrap">Règles & Mots-clés</span>
    </button>

  </nav>


  <!-- Bottom Sidebar Status (100% Local privacy badge) -->
  <div class="p-4 border-t border-[#EAEAE5] bg-[#FAF9F5] text-xs space-y-2">
    <div class="flex items-center justify-between text-century-muted">
      <span class="flex items-center space-x-1.5">
        <span class="w-2 h-2 rounded-full bg-century-sage"></span>
        <span class="font-medium">Confidentialité 100% Locale</span>
      </span>
      <span id="sidebar-statements-count" class="font-mono text-[11px] font-semibold text-century-charcoal">0 PDF</span>
    </div>
    <p class="text-[11px] text-[#7E8881] leading-relaxed">
      Aucune donnée bancaire n'est envoyée vers le cloud. Traitement direct sur votre machine.
    </p>
  </div>

</aside>
