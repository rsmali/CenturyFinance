  <script>
    // Global State with localStorage persistence
    let AppState = {
      currentView: (function() {
        try { return localStorage.getItem('cf_current_view') || 'overview'; } catch (e) { return 'overview'; }
      })(),
      selectedMonth: (function() {
        try { return localStorage.getItem('cf_selected_month') || 'ALL'; } catch (e) { return 'ALL'; }
      })(),
      activeWorkspace: (function() {
        try { return localStorage.getItem('cf_active_workspace') || 'default'; } catch (e) { return 'default'; }
      })(),
      workspaces: [],
      data: null,
      overviewChart: null,
      investmentsChart: null,
      timeMachineChart: null,
      categoryCharts: [],
      budgetDonutChart: null,
      categoryZoomChart: null,
      activeCategoryDetail: null,
      editingTxId: null,
      budget: null,
      budgetBaseline: null,
      deductReimbursements: true,
      activeAuditType: null,
      auditTransactions: [],
    };

    // Strict French Number Formatter (1.468,48 €)
    function formatFR(amount, showSign = false) {
      if (amount === undefined || amount === null || isNaN(amount)) return "0,00 €";
      const isNeg = amount < 0;
      const abs = Math.abs(amount);
      const parts = abs.toFixed(2).split(".");
      // Replace thousands with dot '.'
      const intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      const decPart = parts[1];
      const formatted = `${intPart},${decPart} €`;
      if (isNeg) return `-${formatted}`;
      if (showSign && amount > 0) return `+${formatted}`;
      return formatted;
    }

    function formatFRCompact(val) {
      if (val === 0) return "0 €";
      if (Math.abs(val) >= 1000) {
        const k = (val / 1000).toFixed(1).replace(".", ",");
        return `${k.endsWith(",0") ? k.slice(0, -2) : k}k €`;
      }
      return `${val} €`;
    }

    // Switch between views
    function switchView(viewName) {
      AppState.currentView = viewName;
      try { localStorage.setItem('cf_current_view', viewName); } catch (e) {}
      
      const views = ['overview', 'budget', 'timemachine', 'upload', 'transactions', 'files', 'categories', 'rules'];
      views.forEach(v => {
        const el = document.getElementById(`view-${v}`);
        const nav = document.getElementById(`nav-${v}`);
        if (el) el.classList.add('hidden');
        if (nav) nav.classList.remove('nav-item-active');
      });

      const activeEl = document.getElementById(`view-${viewName}`);
      const activeNav = document.getElementById(`nav-${viewName}`);
      if (activeEl) activeEl.classList.remove('hidden');
      if (activeNav) activeNav.classList.add('nav-item-active');

      // Refresh charts when changing view
      if (viewName === 'overview') {
        setTimeout(() => {
          renderOverviewChart();
          renderInvestmentsChart();
        }, 60);
      } else if (viewName === 'budget') {
        setTimeout(() => {
          renderBudgetSimulator();
        }, 60);
      } else if (viewName === 'timemachine') {
        setTimeout(renderTimeMachineChart, 60);
      } else if (viewName === 'categories') {
        setTimeout(() => {
          if (AppState.data) renderCategories(AppState.data);
        }, 60);
      }
    }

    // Detect static demo hosting (GitHub Pages, file protocol, or port 8000)
    const isStaticDemo = window.location.hostname.endsWith('github.io') || 
                         window.location.protocol === 'file:' || 
                         window.location.port === '8000';

    function renderStaticDemoBanner() {
      if (document.getElementById('static-demo-banner')) return;
      const banner = document.createElement('div');
      banner.id = 'static-demo-banner';
      banner.className = 'bg-[#EBF3ED] border-b border-[#2D5A3C]/20 px-4 py-2 text-xs text-century-charcoal flex items-center justify-between z-50 sticky top-0 backdrop-blur-md shadow-xs';
      banner.innerHTML = `
        <div class="flex items-center space-x-2 truncate">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-600 animate-pulse"></span>
          <span class="font-bold text-century-green font-serif-title">Live Demo GitHub Pages</span>
          <span class="text-century-muted hidden sm:inline">— Navigation interactive avec données de démonstration anonymisées (6 mois).</span>
        </div>
        <div class="flex items-center space-x-3 shrink-0">
          <a href="https://github.com/votre-nom/century-finance" target="_blank" class="text-century-green hover:underline font-bold flex items-center space-x-1">
            <span>Dépôt GitHub (100% Local)</span>
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
          </a>
        </div>
      `;
      const mainContent = document.querySelector('main') || document.body;
      mainContent.prepend(banner);
    }

    // Fetch complete data from Flask API (or static demo JSON for GitHub Pages)
    async function loadDashboardData() {
      try {
        let data;
        const monthKey = AppState.selectedMonth || 'ALL';
        const wsParam = AppState.activeWorkspace ? `&workspace=${AppState.activeWorkspace}` : '';

        if (isStaticDemo) {
          let res = await fetch(`./data/demo_${monthKey}.json`).catch(() => null);
          if (!res || !res.ok) {
            res = await fetch('./data/demo_ALL.json');
          }
          data = await res.json();
          renderStaticDemoBanner();
        } else {
          try {
            const res = await fetch(`/api/data?month=${AppState.selectedMonth}${wsParam}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            data = await res.json();
          } catch (apiErr) {
            console.warn("API backend injoignable, bascule automatique sur les données statiques.", apiErr);
            let res = await fetch(`./data/demo_${monthKey}.json`).catch(() => null);
            if (!res || !res.ok) {
              res = await fetch('./data/demo_ALL.json');
            }
            data = await res.json();
            renderStaticDemoBanner();
          }
        }

        AppState.data = data;
        AppState.workspaces = data.workspaces || [];
        if (data.workspace && data.workspace.id) {
          AppState.activeWorkspace = data.workspace.id;
        }
        
        renderWorkspaceSwitcher(data);
        renderOverview(data);
        renderTimeMachine(data);
        renderFileManagement(data);
        renderTransactions(data);
        renderCategories(data);
        renderRules(data);
        initBudgetSimulator(data);
        updateSidebarBadges(data);
      } catch (err) {
        console.error("Erreur de chargement des données:", err);
      }
    }

    // Workspace / Multi-Account Management
    function renderWorkspaceSwitcher(data) {
      const activeWs = data.workspace || { id: 'default', name: 'Compte Principal (SG)', icon: '🏦' };
      const allWorkspaces = data.workspaces || [activeWs];
      const pdfCount = (data.statements_detailed && data.statements_detailed.length) 
        ? data.statements_detailed.length 
        : (data.statements ? data.statements.length : 0);

      const iconEl = document.getElementById('active-ws-icon');
      const nameEl = document.getElementById('active-ws-name');
      const countEl = document.getElementById('active-ws-count');
      if (iconEl) iconEl.textContent = activeWs.icon || '🏦';
      if (nameEl) nameEl.textContent = activeWs.name || 'Compte Principal (SG)';
      if (countEl) countEl.textContent = `${pdfCount} relevé${pdfCount > 1 ? 's' : ''} PDF`;

      const itemsContainer = document.getElementById('workspace-dropdown-items');
      if (!itemsContainer) return;
      itemsContainer.innerHTML = '';

      allWorkspaces.forEach(ws => {
        const isCurrent = ws.id === activeWs.id;
        const item = document.createElement('div');
        item.className = `flex items-center justify-between px-2.5 py-2 rounded-lg cursor-pointer transition ${
          isCurrent ? 'bg-[#E8F0EC] text-[#2D5A3C] font-semibold' : 'hover:bg-[#FAF9F5] text-century-charcoal'
        }`;
        
        const deleteBtnHtml = (ws.id !== 'default') 
          ? `<button type="button" onclick="deleteWorkspacePrompt(event, '${ws.id}', '${(ws.name || '').replace(/'/g, "\\'")}')" title="Supprimer cet espace" class="p-1 rounded text-century-muted hover:text-red-600 hover:bg-red-50 transition ml-2">
               <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
             </button>`
          : '';

        item.innerHTML = `
          <div class="flex items-center space-x-2.5 truncate flex-1" onclick="switchWorkspace('${ws.id}')">
            <span class="text-base">${ws.icon || '📁'}</span>
            <div class="truncate">
              <span class="text-xs truncate block">${ws.name}</span>
              <span class="text-[10px] text-century-muted block">${ws.account_type || 'Compte'}</span>
            </div>
          </div>
          <div class="flex items-center shrink-0">
            ${isCurrent ? '<span class="text-xs font-bold text-[#2D5A3C] ml-1">✓</span>' : ''}
            ${deleteBtnHtml}
          </div>
        `;
        itemsContainer.appendChild(item);
      });
    }

    function toggleWorkspaceDropdown(e) {
      if (e) e.stopPropagation();
      const menu = document.getElementById('workspace-dropdown-menu');
      if (menu) menu.classList.toggle('hidden');
    }

    // Close workspace dropdown when clicking outside
    window.addEventListener('click', (e) => {
      const btn = document.getElementById('workspace-switcher-btn');
      const menu = document.getElementById('workspace-dropdown-menu');
      if (menu && !menu.classList.contains('hidden') && btn && !btn.contains(e.target) && !menu.contains(e.target)) {
        menu.classList.add('hidden');
      }
    });

    function switchWorkspace(wsId) {
      AppState.activeWorkspace = wsId;
      try { localStorage.setItem('cf_active_workspace', wsId); } catch (e) {}
      const menu = document.getElementById('workspace-dropdown-menu');
      if (menu) menu.classList.add('hidden');
      closeCategoryDetail();
      AppState.budget = null;
      loadDashboardData();
    }

    function openCreateWorkspaceModal() {
      const modal = document.getElementById('workspace-create-modal');
      const menu = document.getElementById('workspace-dropdown-menu');
      if (menu) menu.classList.add('hidden');
      if (modal) modal.classList.remove('hidden');
    }

    function closeCreateWorkspaceModal() {
      const modal = document.getElementById('workspace-create-modal');
      if (modal) modal.classList.add('hidden');
    }

    async function handleCreateWorkspaceSubmit(e) {
      e.preventDefault();
      const name = (document.getElementById('ws-new-name').value || '').trim();
      const accType = document.getElementById('ws-new-type').value;
      const icon = document.getElementById('ws-new-icon').value;

      if (!name) return;

      try {
        const res = await fetch('/api/workspaces/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, account_type: accType, icon })
        });
        const json = await res.json();
        if (json.status === 'ok') {
          closeCreateWorkspaceModal();
          document.getElementById('ws-new-name').value = '';
          switchWorkspace(json.workspace.id);
        } else {
          alert(`Erreur: ${json.error || "Impossible de créer l'espace"}`);
        }
      } catch (err) {
        alert("Erreur de communication lors de la création de l'espace");
      }
    }

    async function deleteWorkspacePrompt(e, wsId, wsName) {
      e.stopPropagation();
      if (!confirm(`Supprimer définitivement l'espace "${wsName}" ainsi que tous ses relevés PDF ?`)) return;

      try {
        const res = await fetch('/api/workspaces/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: wsId })
        });
        const json = await res.json();
        if (json.status === 'ok') {
          if (AppState.activeWorkspace === wsId) {
            AppState.activeWorkspace = 'default';
          }
          loadDashboardData();
        } else {
          alert(`Erreur: ${json.error || "Impossible de supprimer l'espace"}`);
        }
      } catch (err) {
        console.error(err);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function openWorkspaceSettingsModal() {
      const menu = document.getElementById('workspace-dropdown-menu');
      if (menu) menu.classList.add('hidden');

      const modal = document.getElementById('workspace-profile-modal');
      if (!modal) return;

      const profile = (AppState.data && AppState.data.workspace && AppState.data.workspace.profile) 
        ? AppState.data.workspace.profile 
        : {
            salary_employer_name: '',
            salary_keywords: ['SALAIRE', 'REMUNERATION', 'PAYE'],
            account_holder_keywords: [],
            rent_keywords: ['LOYER', 'RENT'],
            family_keywords: [],
            investment_accounts: [
              { id: 'livret_a', name: 'Livret A', keywords: ['LIVRET', 'RETRAIT LIVRET'] },
              { id: 'cto', name: 'CTO / Bourse', keywords: ['INTERACTIVE', 'IBKR', 'CTO'] }
            ]
          };

      document.getElementById('prof-emp-name').value = profile.salary_employer_name || '';
      document.getElementById('prof-salary-keywords').value = (profile.salary_keywords || []).join(', ');
      document.getElementById('prof-holder-keywords').value = (profile.account_holder_keywords || []).join(', ');
      document.getElementById('prof-rent-keywords').value = (profile.rent_keywords || []).join(', ');
      document.getElementById('prof-family-keywords').value = (profile.family_keywords || []).join(', ');

      renderInvestmentAccountRows(profile.investment_accounts || []);
      modal.classList.remove('hidden');
    }

    function closeWorkspaceSettingsModal() {
      const modal = document.getElementById('workspace-profile-modal');
      if (modal) modal.classList.add('hidden');
    }

    function renderInvestmentAccountRows(accounts) {
      const container = document.getElementById('prof-investment-accounts-list');
      if (!container) return;
      container.innerHTML = '';

      if (!accounts || accounts.length === 0) {
        accounts = [
          { id: 'livret_a', name: 'Livret A', keywords: ['LIVRET', 'RETRAIT LIVRET'] },
          { id: 'cto', name: 'CTO / Bourse', keywords: ['INTERACTIVE', 'IBKR', 'CTO'] }
        ];
      }

      accounts.forEach((acc) => {
        const row = document.createElement('div');
        row.className = 'investment-account-row flex items-center space-x-2 bg-[#FAF9F6] p-2 rounded-lg border border-[#EAEAE5]';
        row.innerHTML = `
          <input type="text" placeholder="Nom du compte (ex: Livret A)" value="${escapeHtml(acc.name || '')}" class="inv-acc-name w-1/3 px-2.5 py-1.5 rounded-lg bg-white border border-[#EAEAE5] text-xs font-semibold text-century-charcoal focus:border-[#2D5A3C]">
          <input type="text" placeholder="Mots-clés (séparés par virgules)" value="${escapeHtml((acc.keywords || []).join(', '))}" class="inv-acc-keys flex-1 px-2.5 py-1.5 rounded-lg bg-white border border-[#EAEAE5] text-xs text-century-charcoal focus:border-[#2D5A3C]">
          <button type="button" onclick="this.closest('.investment-account-row').remove()" class="p-1.5 rounded-lg text-century-muted hover:text-rose-600 hover:bg-rose-50 transition" title="Supprimer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          </button>
        `;
        container.appendChild(row);
      });
    }

    function addInvestmentAccountRow() {
      const container = document.getElementById('prof-investment-accounts-list');
      if (!container) return;
      const row = document.createElement('div');
      row.className = 'investment-account-row flex items-center space-x-2 bg-[#FAF9F6] p-2 rounded-lg border border-[#EAEAE5] animate-in fade-in duration-100';
      row.innerHTML = `
        <input type="text" placeholder="Nom du support (ex: PEA, Assurance Vie)" value="" class="inv-acc-name w-1/3 px-2.5 py-1.5 rounded-lg bg-white border border-[#EAEAE5] text-xs font-semibold text-century-charcoal focus:border-[#2D5A3C]">
        <input type="text" placeholder="Mots-clés (séparés par virgules, ex: BOURSO, PEA)" value="" class="inv-acc-keys flex-1 px-2.5 py-1.5 rounded-lg bg-white border border-[#EAEAE5] text-xs text-century-charcoal focus:border-[#2D5A3C]">
        <button type="button" onclick="this.closest('.investment-account-row').remove()" class="p-1.5 rounded-lg text-century-muted hover:text-rose-600 hover:bg-rose-50 transition" title="Supprimer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        </button>
      `;
      container.appendChild(row);
    }

    function resetProfileToDefault() {
      if (!confirm("Réinitialiser le profil avec les paramètres par défaut ?")) return;
      document.getElementById('prof-emp-name').value = '';
      document.getElementById('prof-salary-keywords').value = 'SALAIRE, REMUNERATION, PAYE, VIREMENT SALAIRE';
      document.getElementById('prof-holder-keywords').value = '';
      document.getElementById('prof-rent-keywords').value = 'LOYER, RENT';
      document.getElementById('prof-family-keywords').value = '';
      renderInvestmentAccountRows([
        { id: 'livret_a', name: 'Livret A', keywords: ['LIVRET', 'RETRAIT LIVRET'] },
        { id: 'cto', name: 'CTO / Bourse', keywords: ['INTERACTIVE', 'IBKR', 'CTO'] }
      ]);
    }

    async function handleWorkspaceProfileSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-save-workspace-profile');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<svg class="w-3.5 h-3.5 animate-spin mr-1 inline" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> <span>Recalcul en cours...</span>`;

      const parseCsv = (val) => (val || '').split(',').map(s => s.trim().toUpperCase()).filter(Boolean);

      const investmentAccounts = [];
      const rows = document.querySelectorAll('.investment-account-row');
      rows.forEach(r => {
        const name = (r.querySelector('.inv-acc-name')?.value || '').trim();
        const keys = parseCsv(r.querySelector('.inv-acc-keys')?.value || '');
        if (name) {
          const id = name.toLowerCase().replace(/[^a-z0-9_-]/g, '_');
          investmentAccounts.push({ id, name, keywords: keys });
        }
      });

      const updatedProfile = {
        salary_employer_name: (document.getElementById('prof-emp-name').value || '').trim(),
        salary_keywords: parseCsv(document.getElementById('prof-salary-keywords').value || ''),
        account_holder_keywords: parseCsv(document.getElementById('prof-holder-keywords').value || ''),
        rent_keywords: parseCsv(document.getElementById('prof-rent-keywords').value || ''),
        family_keywords: parseCsv(document.getElementById('prof-family-keywords').value || ''),
        investment_accounts: investmentAccounts
      };

      try {
        const res = await fetch('/api/workspace/profile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            workspace: AppState.activeWorkspace,
            profile: updatedProfile
          })
        });
        const json = await res.json();
        if (json.status === 'ok') {
          closeWorkspaceSettingsModal();
          loadDashboardData();
        } else {
          alert(`Erreur: ${json.error || 'Impossible de mettre à jour le profil'}`);
        }
      } catch (err) {
        console.error(err);
        alert('Erreur réseau lors de la mise à jour du profil');
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }

    // Update sidebar counts & status
    function updateSidebarBadges(data) {
      const txCount = data.transactions ? data.transactions.length : 0;
      const pdfCount = data.statements ? data.statements.length : 0;
      const patternsCount = data.patterns ? data.patterns.length : 6;
      
      const txBadge = document.getElementById('nav-tx-count');
      if (txBadge) txBadge.textContent = txCount;

      const patternsBadge = document.getElementById('nav-patterns-badge');
      if (patternsBadge) patternsBadge.textContent = patternsCount;

      const stCount = document.getElementById('sidebar-statements-count');
      if (stCount) stCount.textContent = `${pdfCount} PDF`;
    }

    // Render View 1: Financial Overview (Screenshot 2)
    function renderOverview(data) {
      const summary = data.summary || {};
      
      document.getElementById('overview-subtitle').textContent = 
        `${summary.total_count || 0} opérations analysées sur ${data.statements ? data.statements.length : 0} relevés`;

      document.getElementById('overview-range-label').textContent = data.date_range_label || "Toutes les périodes";

      // Populate KPIs: Income strictly Seize Consulting, Expenses strictly living (without investments)
      const useNet = AppState.deductReimbursements;
      const expGross = Math.abs(summary.total_living_debits_gross !== undefined ? summary.total_living_debits_gross : summary.total_living_debits || 0);
      const expNet = Math.abs(summary.total_living_debits_net !== undefined ? summary.total_living_debits_net : expGross);
      const displayedExp = useNet ? expNet : expGross;

      document.getElementById('kpi-total-tx').textContent = summary.total_count || 0;
      document.getElementById('kpi-total-income').textContent = formatFR(summary.total_salary !== undefined ? summary.total_salary : summary.total_credits || 0, true);
      document.getElementById('kpi-total-expenses').textContent = formatFR(displayedExp);

      const expTitle = document.getElementById('kpi-expenses-title');
      if (expTitle) {
        expTitle.textContent = useNet ? "Dépenses nettes (après remb.)" : "Dépenses de vie (hors invest.)";
      }
      const expSub = document.getElementById('kpi-expenses-sub');
      if (expSub) {
        expSub.textContent = useNet ? `Brut : ${formatFR(expGross)}` : `Net remb. : ${formatFR(expNet)}`;
      }

      const netSavingsVal = useNet 
        ? (summary.net_real_with_reimb !== undefined ? summary.net_real_with_reimb : summary.net_real || 0)
        : (summary.net_real !== undefined ? summary.net_real : summary.net || 0);
      document.getElementById('kpi-net-savings').textContent = formatFR(netSavingsVal, true);

      const savingsRateVal = useNet 
        ? (summary.savings_rate_net !== undefined ? summary.savings_rate_net : summary.savings_rate || 0)
        : (summary.savings_rate_gross !== undefined ? summary.savings_rate_gross : summary.savings_rate || 0);
      const rateSub = document.getElementById('kpi-savings-rate-sub');
      if (rateSub) {
        rateSub.textContent = `Taux : ${savingsRateVal}%`;
      }

      // Update dynamic employer & salary labels across dashboard
      const empName = data.workspace?.profile?.salary_employer_name || 'Salaires';
      const kpiIncomeTitle = document.getElementById('kpi-income-title');
      if (kpiIncomeTitle) kpiIncomeTitle.textContent = `Revenus Totaux (${empName})`;

      const chartSub = document.getElementById('chart-spending-subtitle');
      if (chartSub) chartSub.textContent = `Revenus (${empName}) vs Dépenses de vie courante (total dépensé - investissements)`;

      const legendInc = document.getElementById('chart-legend-income-label');
      if (legendInc) legendInc.textContent = `Revenus (${empName})`;

      const simSalaryLabel = document.getElementById('sim-salary-label');
      if (simSalaryLabel) simSalaryLabel.textContent = `Salaire Net Mensuel (${empName})`;

      const tmSub = document.getElementById('tm-spending-subtitle');

    function renderMonthFilterPills(data) {
      const container = document.getElementById('dynamic-month-pills');
      if (!container) return;
      container.innerHTML = '';

      const months = (data.trends && data.trends.months) ? data.trends.months : [];
      months.forEach(m => {
        const btn = document.createElement('button');
        const isActive = AppState.selectedMonth === m;
        btn.className = `px-3.5 py-1.5 rounded-lg border text-xs font-medium transition ${
          isActive 
            ? 'filter-pill-active border-[#CDE0D4]' 
            : 'border-transparent text-[#6C7570] hover:text-century-charcoal'
        }`;
        
        const mData = data.trends.monthly_data.find(d => d.month_key === m);
        btn.textContent = mData ? mData.label : m;
        btn.onclick = () => selectMonthFilter(m);
        container.appendChild(btn);
      });
    }

    function selectMonthFilter(monthKey) {
      AppState.selectedMonth = monthKey;
      try { localStorage.setItem('cf_selected_month', monthKey); } catch (e) {}
      
      const allPill = document.getElementById('filter-pill-all');
      if (allPill) {
        if (monthKey === 'ALL') {
          allPill.classList.add('filter-pill-active');
        } else {
          allPill.classList.remove('filter-pill-active');
        }
      }

      loadDashboardData();
    }

    function selectQuickFilter(type) {
      if (type === 'latest' && AppState.data && AppState.data.trends && AppState.data.trends.months.length) {
        const lastMonth = AppState.data.trends.months[AppState.data.trends.months.length - 1];
        selectMonthFilter(lastMonth);
      }
    }

      if (!ctx || !AppState.data) return;

        AppState.overviewChart.destroy();
      }

      const trends = AppState.data.trends || {};
      const monthly = trends.monthly_data || [];

      const labels = monthly.map(m => m.label);

      const useNet = AppState.deductReimbursements;
      const expLabel = useNet ? 'Dépenses de vie nettes (après remb.)' : 'Dépenses de vie (hors invest.)';

              borderColor: '#6E2D38',

    // Chart.js: SEPARATE INVESTMENTS GRAPH (Livret A vs CTO Interactive Brokers)
    function renderInvestmentsChart() {
      const ctx = document.getElementById('investmentsSplineChart');
      if (!ctx || !AppState.data) return;

      if (AppState.investmentsChart) {
        AppState.investmentsChart.destroy();
      }

      const trends = AppState.data.trends || {};
      const monthly = trends.monthly_data || [];

      const labels = monthly.map(m => m.label);
      const invAccounts = (AppState.data.workspace && AppState.data.workspace.profile && AppState.data.workspace.profile.investment_accounts)
                          || (AppState.data.summary && AppState.data.summary.investment_accounts)
                          || [ { id: 'livret_a', name: 'Livret A', color: '#2C4A6F', type: 'savings' } ];

      const chartCtx = ctx.getContext('2d');

      const datasets = invAccounts.map((acc, idx) => {
        const hexColor = acc.color || (idx === 0 ? '#2C4A6F' : '#8B5CF6');
        const grad = chartCtx.createLinearGradient(0, 0, 0, 280);
        let rgb = '44, 74, 111';
        if (hexColor.startsWith('#') && hexColor.length === 7) {
          const r = parseInt(hexColor.slice(1, 3), 16);
          const g = parseInt(hexColor.slice(3, 5), 16);
          const b = parseInt(hexColor.slice(5, 7), 16);
          rgb = `${r}, ${g}, ${b}`;
        }
        grad.addColorStop(0, `rgba(${rgb}, 0.25)`);
        grad.addColorStop(1, `rgba(${rgb}, 0.01)`);

        const accData = monthly.map(m => {
          if (m.investments_by_account && m.investments_by_account[acc.id] !== undefined) {
            return Math.max(0, m.investments_by_account[acc.id].net || m.investments_by_account[acc.id].deposits || 0);
          }
          if (acc.id === 'livret_a') {
            return Math.max(0, m.investments_livret_a_deposits !== undefined ? m.investments_livret_a_deposits : (m.investments_livret_a || 0));
          }
          return Math.max(0, m.investments_cto || 0);
        });

        return {
          label: acc.name,
          data: accData,
          borderColor: hexColor,
          backgroundColor: grad,
          fill: true,
          tension: 0.4,
          borderWidth: 2.2,
          pointRadius: 4,
          pointHoverRadius: 7,
          pointBackgroundColor: hexColor,
        };
      });

      AppState.investmentsChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              enabled: false,
              external: function(context) {
                let tooltipEl = document.getElementById('chartjs-custom-tooltip');
                const tooltipModel = context.tooltip;
                if (tooltipModel.opacity === 0) {
                  tooltipEl.style.opacity = 0;
                  return;
                }
                if (tooltipModel.body) {
                  const title = tooltipModel.title[0] || '';
                  let innerHtml = `<div class="font-serif-title font-semibold text-sm text-century-charcoal mb-1.5">${title}</div>`;
                  tooltipModel.dataPoints.forEach(dp => {
                    const ds = AppState.investmentsChart.data.datasets[dp.datasetIndex];
                    const label = ds ? ds.label : '';
                    const color = ds ? ds.borderColor : '#2C4A6F';
                    innerHtml += `
                      <div class="flex items-center justify-between space-x-4 text-xs">
                        <span class="text-century-muted">${label} :</span>
                        <div class="text-right">
                          <span class="font-bold font-sans" style="color: ${color}">${formatFR(dp.raw)}</span>
                        </div>
                      </div>
                    `;
                  });
                  tooltipEl.innerHTML = innerHtml;
                }
                const position = context.chart.canvas.getBoundingClientRect();
                tooltipEl.style.opacity = 1;
                tooltipEl.style.left = position.left + window.pageXOffset + tooltipModel.caretX + 'px';
                tooltipEl.style.top = position.top + window.pageYOffset + tooltipModel.caretY - 10 + 'px';
              }
            }
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { color: '#6C7570', font: { family: 'Plus Jakarta Sans', size: 11 } }
            },
            y: {
              grid: { color: '#EAEAE5', borderDash: [3, 3], drawBorder: false },
              ticks: {
                color: '#6C7570',
                font: { family: 'Plus Jakarta Sans', size: 11 },
                callback: (val) => formatFRCompact(val)
              }
            }
          }
        }
      });
    }

    function renderAuditModalTable(list) {
      const tbody = document.getElementById('audit-modal-tx-tbody');
      const countBadge = document.getElementById('audit-tx-count-badge');
      const sumBadge = document.getElementById('audit-tx-sum-badge');
      if (!tbody) return;

      tbody.innerHTML = '';
      if (!list || list.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="py-8 text-center text-xs text-century-muted">
              Aucune opération correspondant aux critères de cet audit.
            </td>
          </tr>
        `;
        if (countBadge) countBadge.textContent = '0 opération';
        if (sumBadge) sumBadge.textContent = '0,00 €';
        return;
      }

      const totalSum = list.reduce((acc, t) => acc + (t.amount || 0), 0);
      if (countBadge) countBadge.textContent = `${list.length} opération${list.length > 1 ? 's' : ''}`;
      if (sumBadge) sumBadge.textContent = formatFR(totalSum, true);

      list.forEach(t => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-[#FAF9F5] transition text-xs';
        const isCredit = (t.amount || 0) > 0;
        const amtStr = formatFR(t.amount, isCredit);
        const cleanDesc = t.description || '';
        const cleanMerchant = t.merchant || cleanDesc;

        let impactBadge = '';
        if (t.category === 'Investissements & Épargne') {
          if (isCredit) {
            impactBadge = '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-[#F5F3FF] text-[#7C3AED]">Retrait Épargne (Déduit)</span>';
          } else {
            impactBadge = '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-[#EEF4FF] text-[#2C4A6F]">Épargne Isolée</span>';
          }
        } else if (t.category === 'Livres') {
          impactBadge = '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-[#FEF3C7] text-[#B45309]">Livres / Culture</span>';
        } else if (t.category === 'Salaires & Revenus') {
          impactBadge = '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-[#E8F0EC] text-[#2D5A3C]">Revenu Salarié</span>';
        } else if (t.category === 'Remboursements & Avoirs') {
          impactBadge = '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-[#F0FDFA] text-[#0d9488]">Remboursement Déduit</span>';
        } else if (t.category === 'Cadeaux & Dons') {
          impactBadge = '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-[#FDF2F8] text-[#be185d]">Don / Cadeau (Exclu)</span>';
        } else {
          impactBadge = '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-[#FDF0F2] text-[#6E2D38]">Dépense de vie</span>';
        }

        tr.innerHTML = `
          <td class="py-2.5 px-3 font-mono text-[11px] text-century-muted whitespace-nowrap">${t.date || ''}</td>
          <td class="py-2.5 px-3">
            <span class="font-semibold text-century-charcoal block">${cleanMerchant}</span>
            <span class="text-[11px] text-century-muted font-mono truncate max-w-xs block">${cleanDesc}</span>
          </td>
          <td class="py-2.5 px-3 whitespace-nowrap">
            <span class="px-2 py-0.5 rounded-full text-[10px] font-medium" style="background-color: ${t.color || '#94a3b8'}20; color: ${t.color || '#94a3b8'};">
              ${t.category}
            </span>
          </td>
          <td class="py-2.5 px-3 text-right font-sans font-bold whitespace-nowrap ${isCredit ? 'text-[#2D5A3C]' : 'text-[#6E2D38]'}">
            ${amtStr}
          </td>
          <td class="py-2.5 px-3 text-center whitespace-nowrap">
            ${impactBadge}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterAuditModalTransactions() {
      const q = (document.getElementById('audit-tx-search').value || '').trim().toLowerCase();
      if (!AppState.auditTransactions) return;
      if (!q) {
        renderAuditModalTable(AppState.auditTransactions);
        return;
      }
      const filtered = AppState.auditTransactions.filter(t => {
        const desc = (t.description || '').toLowerCase();
        const merch = (t.merchant || '').toLowerCase();
        const cat = (t.category || '').toLowerCase();
        const amt = (t.amount || '').toString();
        const date = (t.date || '').toLowerCase();
        return desc.includes(q) || merch.includes(q) || cat.includes(q) || amt.includes(q) || date.includes(q);
      });
      renderAuditModalTable(filtered);
    }

    // Custom Tooltip Matching Screenshot 2 exactly
    function customChartTooltip(context) {
      let tooltipEl = document.getElementById('chartjs-custom-tooltip');
      const tooltipModel = context.tooltip;

      if (tooltipModel.opacity === 0) {
        tooltipEl.style.opacity = 0;
        return;
      }

      if (tooltipModel.body) {
        const title = tooltipModel.title[0] || '';
        let innerHtml = `<div class="font-serif-title font-semibold text-sm text-century-charcoal mb-1.5">${title}</div>`;

        tooltipModel.dataPoints.forEach(dp => {
          const isIncome = dp.datasetIndex === 0;
          const empName = AppState.data?.workspace?.profile?.salary_employer_name || 'Salaires';
          const label = isIncome ? `Revenus (${empName})` : 'Dépenses de vie';
          const color = isIncome ? 'text-[#2D5A3C]' : 'text-[#6E2D38]';
          const formattedAmt = formatFR(dp.raw);
          innerHtml += `
            <div class="flex items-center justify-between space-x-4 text-xs">
              <span class="text-century-muted">${label} :</span>
              <span class="font-bold font-sans ${color}">${formattedAmt}</span>
            </div>
          `;
        });

        tooltipEl.innerHTML = innerHtml;
      }

      const position = context.chart.canvas.getBoundingClientRect();
      tooltipEl.style.opacity = 1;
      tooltipEl.style.left = position.left + window.pageXOffset + tooltipModel.caretX + 'px';
      tooltipEl.style.top = position.top + window.pageYOffset + tooltipModel.caretY - 10 + 'px';
    }

    // Chart.js: Time Machine Spending Over Time (Screenshot 1)
    function renderTimeMachineChart() {
      const ctx = document.getElementById('timeMachineChart');
      if (!ctx || !AppState.data) return;

      if (AppState.timeMachineChart) {
        AppState.timeMachineChart.destroy();
      }

      const trends = AppState.data.trends || {};
      const monthly = trends.monthly_data || [];

      const labels = monthly.map(m => m.label);
      const incomeData = monthly.map(m => m.income);
      const spendingData = monthly.map(m => m.expenses_living !== undefined ? m.expenses_living : m.expenses);

      const chartCtx = ctx.getContext('2d');
      const greenGradient = chartCtx.createLinearGradient(0, 0, 0, 300);
      greenGradient.addColorStop(0, 'rgba(45, 90, 60, 0.28)');
      greenGradient.addColorStop(1, 'rgba(45, 90, 60, 0.02)');

      const burgundyGradient = chartCtx.createLinearGradient(0, 0, 0, 300);
      burgundyGradient.addColorStop(0, 'rgba(110, 45, 56, 0.24)');
      burgundyGradient.addColorStop(1, 'rgba(110, 45, 56, 0.02)');

      AppState.timeMachineChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: `Revenus (${AppState.data?.workspace?.profile?.salary_employer_name || 'Salaires'})`,
              data: incomeData,
              borderColor: '#2D5A3C',
              backgroundColor: greenGradient,
              fill: true,
              tension: 0.4,
              borderWidth: 2,
              pointRadius: 3,
              pointHoverRadius: 6,
              pointBackgroundColor: '#2D5A3C',
            },
            {
              label: 'Dépenses (Vie courante)',
              data: spendingData,
              borderColor: '#6E2D38',
              backgroundColor: burgundyGradient,
              fill: true,
              tension: 0.4,
              borderWidth: 2,
              pointRadius: 3,
              pointHoverRadius: 6,
              pointBackgroundColor: '#6E2D38',
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },

    async function reprocessStatement(filename) {
      try {
        const res = await fetch('/api/reprocess-statement', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename, workspace: AppState.activeWorkspace || 'default' })
        });
        const data = await res.json();
        if (data.status === 'ok') {
          loadDashboardData();
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function deleteStatement(filename) {
      if (!confirm(`Supprimer définitivement le relevé ${filename} ?`)) return;
      try {
        const res = await fetch('/api/delete-statement', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename, workspace: AppState.activeWorkspace || 'default' })
        });
        const data = await res.json();
        if (data.status === 'ok') {
          loadDashboardData();
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function handleMultiplePDFUpload(input) {
      const files = input.files;
      if (!files || files.length === 0) return;

      const formData = new FormData();
      formData.append('workspace', AppState.activeWorkspace || 'default');
      for (let i = 0; i < files.length; i++) {
        formData.append('pdf', files[i]);
      }

      const statusBox = document.getElementById('upload-status-box');
      if (statusBox) {
        statusBox.classList.remove('hidden');
        statusBox.textContent = `Téléchargement et analyse de ${files.length} relevé(s) en cours...`;
      }

      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });
        const json = await res.json();
        if (json.status === 'ok') {
          if (statusBox) statusBox.textContent = `✓ ${json.saved_count} relevé(s) analysé(s) avec succès !`;
          input.value = '';
          loadDashboardData();
          setTimeout(() => switchView('files'), 800);
        } else {
          if (statusBox) statusBox.textContent = `Erreur: ${json.error || 'Échec de traitement'}`;
        }
      } catch (err) {
        if (statusBox) statusBox.textContent = `Erreur de communication avec le serveur.`;
      }
    }

    function applyTransactionFilters() {
      if (!AppState.data || !AppState.data.transactions) return;

      const q = (document.getElementById('tx-search-input').value || '').toLowerCase().trim();
      const cat = document.getElementById('tx-category-filter').value;
      const type = document.getElementById('tx-type-filter').value;

      let filtered = AppState.data.transactions.filter(t => {
        const matchQ = !q || 
          (t.merchant && t.merchant.toLowerCase().includes(q)) ||
          (t.description && t.description.toLowerCase().includes(q)) ||
          (t.category && t.category.toLowerCase().includes(q)) ||
          (t.amount && t.amount.toString().includes(q));

        const matchCat = (cat === 'ALL') || (t.category === cat);
        const matchType = (type === 'ALL') || (t.type === type);

        return matchQ && matchCat && matchType;
      });

      const tbody = document.getElementById('transactions-table-body');
      const emptyState = document.getElementById('tx-empty-state');
      tbody.innerHTML = '';

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      filtered.forEach(tx => {
        const isCredit = tx.type === 'Credit';
        const amtFormatted = formatFR(tx.amount, true);
        const amtColor = isCredit ? 'text-[#2D5A3C]' : 'text-[#6E2D38]';
        const cleanMerchant = tx.merchant || tx.description || 'Opération';

        const row = document.createElement('tr');
        row.className = 'hover:bg-[#FAF9F5] transition';
        row.innerHTML = `
          <td class="py-3 px-4 text-century-muted whitespace-nowrap font-mono text-[11px]">${tx.date}</td>
          <td class="py-3 px-4">
            <span class="inline-flex items-center space-x-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium" style="background-color: ${tx.color}15; color: ${tx.color};">
              <span>${tx.icon || '📦'}</span>
              <span>${tx.category}</span>
            </span>
          </td>
          <td class="py-3 px-4">
            <div class="font-semibold text-century-charcoal text-xs">${cleanMerchant}</div>
            <div class="text-[11px] text-century-muted truncate max-w-md">${tx.description}</div>
          </td>
          <td class="py-3 px-4 text-century-muted text-[11px] whitespace-nowrap font-mono">${tx.statement_file || ''}</td>
          <td class="py-3 px-4 text-right font-bold text-xs whitespace-nowrap ${amtColor}">${amtFormatted}</td>
          <td class="py-3 px-4 text-center">
            <button onclick="openCategoryModal('${tx.id}')" title="Changer la catégorie" class="p-1 rounded text-century-muted hover:text-century-charcoal hover:bg-[#EAEAE5] transition">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            </button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function openCategoryModal(txId) {
      if (!AppState.data || !AppState.data.transactions) return;
      const tx = AppState.data.transactions.find(t => t.id === txId);
      if (!tx) return;

      AppState.editingTxId = txId;
      document.getElementById('modal-tx-desc').textContent = tx.merchant || tx.description;
      document.getElementById('modal-tx-meta').textContent = `${tx.date} • ${formatFR(tx.amount, true)}`;
      document.getElementById('modal-category-select').value = tx.category;
      
      let rawDesc = tx.description || "";
      let clean = rawDesc.replace(/^(?:CARTE\s+X\d+\s+\d\d\/\d\d\s+|PAIEMENT\s+CB\s+\d\d\/\d\d\s+|VIR\s+EUROPEEN\s+EMIS\s+LOGITEL\s+POUR:\s+|VIREMENT\s+SEPA\s+EMIS\s+|PRELEVEMENT\s+SEPA\s+|COTISATION\s+)/i, "").trim();
      let kwProposal = tx.merchant && tx.merchant.toUpperCase() !== "DIVERS" 
        ? tx.merchant 
        : (clean ? clean.split(/\s+/)[0] : "");
      
      if (kwProposal.toUpperCase() === "DIVERS") kwProposal = "";

      document.getElementById('modal-rule-keyword').value = kwProposal;
      document.getElementById('modal-remember-rule').checked = true;

      document.getElementById('category-edit-modal').classList.remove('hidden');
    }

    function closeCategoryModal() {
      document.getElementById('category-edit-modal').classList.add('hidden');
      AppState.editingTxId = null;
    }

    async function saveCategoryModalChange() {
      if (!AppState.editingTxId) return;

      const newCategory = document.getElementById('modal-category-select').value;
      const remember = document.getElementById('modal-remember-rule').checked;
      const customKw = document.getElementById('modal-rule-keyword').value.trim();

      try {
        const res = await fetch('/api/update-category', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: AppState.editingTxId,
            category: newCategory,
            remember_rule: remember,
            pattern: customKw,
            workspace: AppState.activeWorkspace || 'default'
          })
        });
        const json = await res.json();
        if (json.status === 'ok') {
          closeCategoryModal();
          loadDashboardData();
        }
      } catch (err) {
        console.error(err);
      }
    }

    // Render View 6: Category Analysis (Dedicated graph for each category with anomaly detection & drill-down)
    function renderCategories(data) {
      const trends = data.trends || {};
      const catTrends = trends.category_trends || [];
      const insights = data.insights || {};

      // If already viewing a category detail, refresh it
      if (AppState.activeCategoryDetail) {
        openCategoryDetail(AppState.activeCategoryDetail);
        return;
      }

      // Potential savings / optimization banner
      const invAnalysis = trends.investment_analysis || {};
      const invDiag = invAnalysis.diagnosis;
      const optTagEl = document.getElementById('optimization-tag');
      const optTitleEl = document.getElementById('optimization-title');
      const optLabelEl = document.getElementById('optimization-label');
      const optAmtEl = document.getElementById('optimization-potential-amount');
      const optTextEl = document.getElementById('optimization-text');

      if (invDiag && invDiag.status === 'under_investing') {
        const idle = Math.max(0, (invAnalysis.monthly_cash_margin || 0) - (invAnalysis.avg_monthly_invested || 0));
        if (optTagEl) optTagEl.textContent = "Constitution Patrimoniale";
        if (optTitleEl) optTitleEl.textContent = "Capacité d'Investissement & Trésorerie Dormante";
        if (optLabelEl) optLabelEl.textContent = "Capacité disponible";
        if (optAmtEl) optAmtEl.textContent = `+${formatFR(idle)}/mois`;
        if (optTextEl) optTextEl.textContent = `Capacité d'investissement sous-exploitée : Vous dégagez un excédent moyen de ${formatFR(invAnalysis.monthly_cash_margin)}/mois après dépenses courantes, mais n'en placez que ${formatFR(invAnalysis.avg_monthly_invested)}/mois. Placer automatiquement environ ${formatFR(idle)}/mois vers un Livret A ou PEA optimiserait votre patrimoine dormant.`;
      } else {
        const potAmt = data.summary?.potential_savings_monthly || (insights.potential_savings ? Math.round(insights.potential_savings / (trends.months?.length || 1)) : 60);
        if (optTagEl) optTagEl.textContent = "Optimisation Budgétaire";
        if (optTitleEl) optTitleEl.textContent = "Repas commandés, Restaurants & Abonnements superflus";
        if (optLabelEl) optLabelEl.textContent = "Économies potentielles";
        if (optAmtEl) optAmtEl.textContent = `+${formatFR(potAmt)}/mois`;
        const currentAvgSavings = data.summary?.monthly_avg_savings || 1600;
        let optText = `En réduisant de 35% les repas commandés (Uber Eats / livraisons) et sorties festives, vous pourriez dégager environ ${formatFR(potAmt)} d'épargne supplémentaire chaque mois (en complément de vos ${formatFR(currentAvgSavings)}/mois d'épargne moyenne actuelle).`;
        if (optTextEl) optTextEl.textContent = optText;
      }

      const grid = document.getElementById('categories-cards-grid');
      if (!grid) return;
      grid.innerHTML = '';

      // Destroy previously rendered category mini-charts
      if (AppState.categoryCharts && AppState.categoryCharts.length > 0) {
        AppState.categoryCharts.forEach(c => c.destroy());
        AppState.categoryCharts = [];
      }

      if (catTrends.length === 0) {
        grid.innerHTML = '<div class="c-card p-6 text-century-muted text-xs col-span-full text-center">Aucune dépense catégorisée pour le moment.</div>';
        return;
      }

      catTrends.forEach((ct, idx) => {
        const hasMajorSpike = ct.out_of_ordinary && ct.unusual_months && ct.unusual_months.length > 0;
        const card = document.createElement('div');
        card.className = `c-card c-card-interactive p-5 space-y-3 flex flex-col justify-between cursor-pointer group ${hasMajorSpike ? 'border-amber-300 shadow-sm' : ''}`;
        card.onclick = () => openCategoryDetail(ct.category);
        
        const canvasId = `catChart-${idx}`;
        const unusualSet = new Set((ct.unusual_months || []).map(u => u.index));

        // High-value, contextual badge HTML
        let badgeHtml = '';
        if (ct.rent_neutral) {
          badgeHtml = `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200">✅ 100% compensé</span>`;
        } else if (hasMajorSpike) {
          badgeHtml = `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-amber-50 text-amber-800 border border-amber-200">⚠️ Pic en ${ct.unusual_months[0].month_label.split(' ')[0]}</span>`;
        } else if (ct.category === 'Investissements & Épargne') {
          const invRate = trends.investment_analysis?.overall_savings_rate || 20;
          badgeHtml = `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-purple-50 text-purple-800 border border-purple-200">${invRate}% des revenus</span>`;
        } else if (ct.budget_share_pct > 0) {
          const isLarge = ct.budget_share_pct >= 20;
          const badgeClass = isLarge ? 'bg-[#FAF3EA] text-[#9A6B22] border-[#F6E1B5]' : 'bg-[#F0F2ED] text-[#4A5550] border-[#EAEAE5]';
          badgeHtml = `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-medium ${badgeClass} border">${ct.budget_share_pct}% du budget</span>`;
        }

        // Status or insightful description message
        let statusMessageHtml = '';
        if (ct.rent_neutral) {
          statusMessageHtml = `
            <div class="mt-2 text-[11px] text-[#2D5A3C] font-medium">
              ✅ Loyer 100% compensé par les virements reçus (reste 0,00 € net).
            </div>
          `;
        } else if (ct.category === 'Investissements & Épargne') {
          const isLumpy = trends.investment_analysis?.has_lumpy_investments;
          const invRate = trends.investment_analysis?.overall_savings_rate || 20;
          statusMessageHtml = `
            <div class="mt-2 text-[11px] text-[#555E58] leading-relaxed">
              ${isLumpy ? 'Versements ponctuels compensés par des apports plus forts (s\'équilibrent sur la durée)' : 'Flux régulier d\'accumulation patrimoniale'} (${invRate}% des revenus).
            </div>
          `;
        } else if (hasMajorSpike) {
          statusMessageHtml = `
            <div class="mt-2 p-2.5 rounded-xl bg-[#FDF8EE] border border-[#F6E1B5] text-[#9A6B22] text-[11px] leading-relaxed">
              <strong>Dépense ponctuelle :</strong> ${ct.unusual_months.map(u => u.message).join(' ')}
            </div>

            contextDesc = `Représente ${share}% de votre budget de vie (${formatFR(ct.avg_monthly)}/mois en moyenne).`;

      const mainView = document.getElementById('categories-main-view');
      const detailView = document.getElementById('category-detail-view');
      if (mainView) mainView.classList.add('hidden');
      if (detailView) detailView.classList.remove('hidden');

      const catTrends = (AppState.data.trends && AppState.data.trends.category_trends) ? AppState.data.trends.category_trends : [];
      const ct = catTrends.find(c => c.category === catName) || {
        category: catName,
        icon: '📦',
        color: '#2D5A3C',
        total_spent: 0,
        avg_monthly: 0,
        budget_share_pct: 0,
        pct_of_budget: 0,
        months: [],
        history: []
      };

      const iconEl = document.getElementById('cat-detail-icon');
      const titleEl = document.getElementById('cat-detail-title');
      if (iconEl) iconEl.textContent = ct.icon || '📦';
      if (titleEl) titleEl.textContent = ct.category;

      const anomalyBadge = document.getElementById('cat-detail-anomaly-badge');
      if (anomalyBadge) {
        if (ct.out_of_ordinary && ct.unusual_months && ct.unusual_months.length > 0) {
          anomalyBadge.classList.remove('hidden');
          anomalyBadge.textContent = `⚠️ Pic ponctuel en ${ct.unusual_months[0].month_label || ''}`;
        } else {
          anomalyBadge.classList.add('hidden');
        }
      }

      // Filter transactions for this category (including offsetting credits for investments & reimbursements)
      const profile = AppState.data?.workspace?.profile || {};
      const accountHolders = profile.account_holder_keywords || [];
      const rentKeywords = profile.rent_keywords || ['LOYER', 'RENT'];
      const txs = (AppState.data.transactions || []).filter(t => {
        if (t.category === catName) return true;
        if (catName === 'Investissements & Épargne') {
          const desc = (t.description || '').toUpperCase();
          const merch = (t.merchant || '').toUpperCase();
          return desc.includes('LIVRET') || merch.includes('LIVRET') || desc.includes('BROKER') || merch.includes('BROKER') || (accountHolders.some(k => desc.includes(k.toUpperCase())) && desc.includes('VIR RECU'));
        }
        if (catName === 'Logement & Énergie') {
          const desc = (t.description || '').toUpperCase();
          const merch = (t.merchant || '').toUpperCase();
          return rentKeywords.some(k => merch.includes(k.toUpperCase()) || desc.includes(k.toUpperCase()));
        }
        return false;
      });

      // Compute net spent across these transactions
      let netSpent = 0;
      let hasCredits = false;
      txs.forEach(t => {
        if (t.type === 'Debit') {
          netSpent += Math.abs(t.amount || 0);
        } else if (t.type === 'Credit') {
          netSpent -= Math.abs(t.amount || 0);
          hasCredits = true;
        }
      });
      const displayTotal = hasCredits ? Math.max(0, netSpent) : ct.total_spent;

      const kpiTotal = document.getElementById('cat-detail-kpi-total');
      const kpiAvg = document.getElementById('cat-detail-kpi-avg');
      const kpiShare = document.getElementById('cat-detail-kpi-share');
      const kpiCount = document.getElementById('cat-detail-kpi-count');
      if (kpiTotal) kpiTotal.textContent = formatFR(displayTotal);
      if (kpiAvg) kpiAvg.textContent = `${formatFR(ct.avg_monthly)} / mois`;
      if (kpiShare) {
        if (ct.category === 'Investissements & Épargne') {
          const invRate = AppState.data?.trends?.investment_analysis?.overall_savings_rate || 20;
          kpiShare.textContent = `${invRate}% (Revenus)`;
        } else {
          kpiShare.textContent = `${ct.budget_share_pct || ct.pct_of_budget || 0}%`;
        }
      }
      if (kpiCount) kpiCount.textContent = txs.length;

      const chartMeta = document.getElementById('cat-detail-chart-meta');
      if (chartMeta) {
        chartMeta.textContent = (ct.months && ct.months.length > 0) 
          ? `${ct.months[0]} — ${ct.months[ct.months.length - 1]}`
          : 'Toutes les périodes';
      }

      // Reset search input
      const searchInput = document.getElementById('cat-detail-tx-search');
      if (searchInput) searchInput.value = '';

      renderCategoryDetailTransactions(txs);
      renderCategoryZoomChart(ct);
    }

      const history = ct.history || [];
      const avg = ct.avg_monthly || 0;
      const unusualIndices = new Set((ct.unusual_months || []).map(u => u.index));

      const barBgColors = history.map((_, i) => unusualIndices.has(i) ? 'rgba(239, 68, 68, 0.85)' : (ct.color || '#2D5A3C'));
      const avgLineData = labels.map(() => avg);

      AppState.categoryZoomChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            {
              type: 'line',

                  const diff = val - avg;

    function filterCategoryDetailTransactions() {
      if (!AppState.data || !AppState.activeCategoryDetail) return;
      const catName = AppState.activeCategoryDetail;
      const profile = AppState.data?.workspace?.profile || {};
      const accountHolders = profile.account_holder_keywords || [];
      const rentKeywords = profile.rent_keywords || ['LOYER', 'RENT'];
      const q = (document.getElementById('cat-detail-tx-search').value || '').toLowerCase().trim();
      const txs = (AppState.data.transactions || []).filter(t => {
        let matchCat = (t.category === catName);
        if (!matchCat) {
          if (catName === 'Investissements & Épargne') {
            const desc = (t.description || '').toUpperCase();
            const merch = (t.merchant || '').toUpperCase();
            matchCat = desc.includes('LIVRET') || merch.includes('LIVRET') || desc.includes('BROKER') || merch.includes('BROKER') || (accountHolders.some(k => desc.includes(k.toUpperCase())) && desc.includes('VIR RECU'));
          } else if (catName === 'Logement & Énergie') {
            const desc = (t.description || '').toUpperCase();
            const merch = (t.merchant || '').toUpperCase();
            matchCat = rentKeywords.some(k => merch.includes(k.toUpperCase()) || desc.includes(k.toUpperCase()));
          }
        }
        if (!matchCat) return false;
        if (!q) return true;
        return (t.merchant && t.merchant.toLowerCase().includes(q)) ||
               (t.description && t.description.toLowerCase().includes(q)) ||
               (t.amount && t.amount.toString().includes(q)) ||
               (t.date && t.date.includes(q));
      });
      renderCategoryDetailTransactions(txs);
    }

    function exportCurrentCategoryCSV() {
      if (!AppState.data || !AppState.activeCategoryDetail) return;
      const catName = AppState.activeCategoryDetail;
      const profile = AppState.data?.workspace?.profile || {};
      const accountHolders = profile.account_holder_keywords || [];
      const rentKeywords = profile.rent_keywords || ['LOYER', 'RENT'];
      const txs = (AppState.data.transactions || []).filter(t => {
        if (t.category === catName) return true;
        if (catName === 'Investissements & Épargne') {
          const desc = (t.description || '').toUpperCase();
          const merch = (t.merchant || '').toUpperCase();
          return desc.includes('LIVRET') || merch.includes('LIVRET') || desc.includes('BROKER') || merch.includes('BROKER') || (accountHolders.some(k => desc.includes(k.toUpperCase())) && desc.includes('VIR RECU'));
        }
        if (catName === 'Logement & Énergie') {
          const desc = (t.description || '').toUpperCase();
          const merch = (t.merchant || '').toUpperCase();
          return rentKeywords.some(k => merch.includes(k.toUpperCase()) || desc.includes(k.toUpperCase()));
        }
        return false;
      });
      if (txs.length === 0) {
        alert("Aucune transaction à exporter pour cette catégorie.");
        return;
      }
      const headers = ["Date", "Catégorie", "Commerçant", "Description", "Montant", "Relevé"];
      const rows = txs.map(t => [
        t.date || '',
        `"${(t.category || '').replace(/"/g, '""')}"`,
        `"${(t.merchant || '').replace(/"/g, '""')}"`,
        `"${(t.description || '').replace(/"/g, '""')}"`,
        t.amount !== undefined ? t.amount : 0,
        `"${(t.statement_file || '').replace(/"/g, '""')}"`
      ]);
      const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `transactions_${catName.toLowerCase().replace(/[^a-z0-9]/g, '_')}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

      const salInput = document.getElementById('sim-input-salary');
      const salRange = document.getElementById('sim-range-salary');
      if (salInput) salInput.value = Math.round(AppState.budget.salary);
      if (salRange) salRange.value = Math.min(6000, Math.round(AppState.budget.salary));

      const oIncInput = document.getElementById('sim-input-other-income');
      if (oIncInput) oIncInput.value = Math.round(AppState.budget.other_income);

      for (const [catName, cfg] of Object.entries(BUDGET_CAT_MAP)) {
        const val = AppState.budget.categories[catName] !== undefined ? Math.round(AppState.budget.categories[catName]) : 0;
        const inp = document.getElementById(cfg.input);
        const rng = document.getElementById(cfg.range);
        if (inp) inp.value = val;
        if (rng) rng.value = Math.min(cfg.max, val);

      const investContainer = document.getElementById('sim-investments-container');
      const invAccs = (AppState.data?.workspace?.profile?.investment_accounts) 
                      || (AppState.budgetBaseline?.investment_accounts) 
                      || [ { id: 'livret_a', name: 'Livret A', color: '#2C4A6F' } ];

      const num = parseFloat(val) || 0;
      if (!AppState.budget.investments) AppState.budget.investments = {};
      AppState.budget.investments[field] = num;
      const inp = document.getElementById(`sim-input-invest-${field}`);
      if (inp) inp.value = num;

    function calculateBudget() {
      if (!AppState.budget) return;

      const totalIncome = (AppState.budget.salary || 0) + (AppState.budget.other_income || 0);

      let totalFixed = 0;
      let totalEssentials = 0;
      let totalLifestyle = 0;

      for (const [catName, cfg] of Object.entries(BUDGET_CAT_MAP)) {
        const amt = AppState.budget.categories[catName] || 0;
        if (cfg.type === 'fixed') totalFixed += amt;
        else if (cfg.type === 'essential') totalEssentials += amt;
        else if (cfg.type === 'lifestyle') totalLifestyle += amt;
      }

      const totalLivingExpenses = totalFixed + totalEssentials + totalLifestyle;
      const totalInvestments = Object.values(AppState.budget.investments || {}).reduce((a, b) => a + (parseFloat(b) || 0), 0);
      const leftover = totalIncome - totalLivingExpenses - totalInvestments;
      const annualWealth = (leftover + totalInvestments) * 12;
      const savingsRate = totalIncome > 0 ? ((leftover + totalInvestments) / totalIncome * 100) : 0;

      const secInvest = document.getElementById('sim-sec-invest-total');
      if (secInvest) secInvest.textContent = formatFR(totalInvestments);

      // Update Top KPIs
      const incEl = document.getElementById('sim-kpi-income');
      if (incEl) incEl.textContent = formatFR(totalIncome);

      const expEl = document.getElementById('sim-kpi-expenses');
      if (expEl) expEl.textContent = formatFR(totalLivingExpenses);

      const invEl = document.getElementById('sim-kpi-investments');
      if (invEl) invEl.textContent = formatFR(totalInvestments);

      const leftEl = document.getElementById('sim-kpi-leftover');
      if (leftEl) {
        leftEl.textContent = formatFR(leftover, true);
        if (leftover >= 0) {
          leftEl.className = 'text-2xl font-bold font-sans text-[#059669]';
        } else {
          leftEl.className = 'text-2xl font-bold font-sans text-[#DC2626]';
        }
      }

      // Section totals
      const sIncEl = document.getElementById('sim-sec-income-total');
      if (sIncEl) sIncEl.textContent = formatFR(totalIncome);

      const sFixEl = document.getElementById('sim-sec-fixed-total');
      if (sFixEl) sFixEl.textContent = formatFR(totalFixed);

      const sEssEl = document.getElementById('sim-sec-essentials-total');
      if (sEssEl) sEssEl.textContent = formatFR(totalEssentials);

      const sLifeEl = document.getElementById('sim-sec-lifestyle-total');
      if (sLifeEl) sLifeEl.textContent = formatFR(totalLifestyle);

      const sInvEl = document.getElementById('sim-sec-invest-total');
      if (sInvEl) sInvEl.textContent = formatFR(totalInvestments);

      // Annual wealth heading
      const annEl = document.getElementById('sim-annual-wealth');
      if (annEl) annEl.textContent = `${formatFR(annualWealth)} / an`;

      const rateEl = document.getElementById('sim-savings-rate-badge');
      if (rateEl) {
        rateEl.textContent = `${savingsRate.toFixed(1)}%`;
        rateEl.className = `text-3xl font-bold font-sans ${savingsRate >= 20 ? 'text-[#2D5A3C]' : (savingsRate >= 10 ? 'text-[#D97706]' : 'text-[#DC2626]')}`;
      }

      // Delta comparison message vs baseline
      const deltaMsg = document.getElementById('sim-delta-message');
      if (deltaMsg) {
        const bl = AppState.budgetBaseline || {};
        const blLeft = bl.money_left_over || 0;
        const diffLeft = leftover - blLeft;
        if (leftover >= 0) {
          if (diffLeft >= 5) {
            deltaMsg.innerHTML = `Excellent ! Vos ajustements dégagent un <strong>surplus net de ${formatFR(leftover)}</strong> chaque mois, soit <strong>+${formatFR(diffLeft)} de plus</strong> que votre moyenne des 4 derniers mois. Vous accumulez ${formatFR(annualWealth)} d'épargne et capital par an.`;
          } else if (diffLeft <= -5) {
            deltaMsg.innerHTML = `Simulation viable : vous conservez un <strong>surplus de ${formatFR(leftover)}/mois</strong> (${formatFR(diffLeft)} vs historique 4 mois). Patrimoine annuel projeté : <strong>${formatFR(annualWealth)}</strong>.`;
          } else {
            deltaMsg.innerHTML = `Scénario fidèle à votre rythme de vie actuel : <strong>${formatFR(leftover)} de reste à vivre net</strong> par mois et <strong>${formatFR(annualWealth)}</strong> de capital accumulé sur l'année.`;
          }
        } else {
          deltaMsg.innerHTML = `<span class="text-rose-600 font-semibold">⚠️ Déficit budgétaire :</span> vos charges et investissements dépassent vos revenus de <strong>${formatFR(Math.abs(leftover))} par mois</strong>. Ajustez votre loyer, vos sorties ou vos investissements pour revenir à l'équilibre.`;
        }
      }

      // 50/30/20 Benchmark
      const needsTotal = totalFixed + totalEssentials;
      const wantsTotal = totalLifestyle;
      const savingsTotal = Math.max(0, totalInvestments + leftover);

      const needsPct = totalIncome > 0 ? Math.round((needsTotal / totalIncome) * 100) : 0;
      const wantsPct = totalIncome > 0 ? Math.round((wantsTotal / totalIncome) * 100) : 0;
      const savingsPct = totalIncome > 0 ? Math.round((savingsTotal / totalIncome) * 100) : 0;

      const bNeedsVal = document.getElementById('bench-needs-val');
      if (bNeedsVal) bNeedsVal.textContent = `${needsPct}% (max 50%)`;
      const bNeedsBar = document.getElementById('bench-needs-bar');
      if (bNeedsBar) bNeedsBar.style.width = `${Math.min(100, needsPct)}%`;

      const bWantsVal = document.getElementById('bench-wants-val');
      if (bWantsVal) bWantsVal.textContent = `${wantsPct}% (max 30%)`;
      const bWantsBar = document.getElementById('bench-wants-bar');
      if (bWantsBar) bWantsBar.style.width = `${Math.min(100, wantsPct)}%`;

      const bSavVal = document.getElementById('bench-savings-val');
      if (bSavVal) bSavVal.textContent = `${savingsPct}% (min 20%)`;
      const bSavBar = document.getElementById('bench-savings-bar');
      if (bSavBar) bSavBar.style.width = `${Math.min(100, savingsPct)}%`;

      // Donut percentages
      const pctNeedsEl = document.getElementById('sim-pct-needs');
      if (pctNeedsEl) pctNeedsEl.textContent = `${needsPct}%`;
      const pctWantsEl = document.getElementById('sim-pct-wants');
      if (pctWantsEl) pctWantsEl.textContent = `${wantsPct}%`;
      const pctSavEl = document.getElementById('sim-pct-savings');
      if (pctSavEl) pctSavEl.textContent = `${savingsPct}%`;

      // Advice message
      const benchAdvice = document.getElementById('sim-bench-advice');
      if (benchAdvice) {
        if (needsPct > 55) {
          benchAdvice.innerHTML = `⚠️ Vos charges fixes et besoins essentiels représentent <strong>${needsPct}%</strong> de vos revenus (recommandé : ≤ 50%). Un loyer ou des abonnements plus légers vous apporteraient une marge de sécurité supérieure.`;
        } else if (savingsPct >= 20) {
          benchAdvice.innerHTML = `✓ <strong>Objectif 50/30/20 validé !</strong> Vos investissements et votre reste à vivre représentent <strong>${savingsPct}%</strong> de vos revenus. Votre santé financière est optimale.`;
        } else {
          benchAdvice.innerHTML = `💡 Votre taux d'épargne actuel est de <strong>${savingsPct}%</strong>. Pour atteindre le seuil de 20%, essayez de réduire légèrement la catégorie Restaurants & Sorties (-35%) ou modérez vos charges fixes.`;
        }
      }

      renderBudgetDonutChart(needsTotal, wantsTotal, savingsTotal);
    }

    function renderBudgetDonutChart(needs, wants, savings) {
      const ctx = document.getElementById('budgetBreakdownDonutChart');
      if (!ctx) return;
      if (AppState.budgetDonutChart) {
        AppState.budgetDonutChart.destroy();
      }

      AppState.budgetDonutChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Besoins & Logement', 'Envies & Sorties', 'Épargne & Reste à vivre'],
          datasets: [{
            data: [Math.max(0, needs), Math.max(0, wants), Math.max(0, savings)],
            backgroundColor: ['#2563EB', '#F59E0B', '#10B981'],
            borderWidth: 0,
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '72%',
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (c) => ` ${c.label}: ${formatFR(c.raw)}`
              }
            }
          }
        }
      });
    }

    function renderBudgetSimulator() {
      if (AppState.data && AppState.data.budget_baseline) {
        initBudgetSimulator(AppState.data);
      }
    }

    // Render View 7: Rules & Keywords
    function renderRules(data) {
      const rules = data.user_rules || [];
      document.getElementById('rules-count-badge').textContent = `${rules.length} règles`;

      const tbody = document.getElementById('rules-table-body');
      tbody.innerHTML = '';

      rules.forEach(r => {
        const row = document.createElement('tr');
        row.className = 'hover:bg-[#FAF9F5] transition';
        row.innerHTML = `
          <td class="py-3 px-6 font-mono font-bold text-xs text-century-charcoal">${r.pattern}</td>
          <td class="py-3 px-6">
            <span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-[#E8F0EC] text-[#2D5A3C]">
              ${r.category}
            </span>
          </td>
          <td class="py-3 px-6 text-century-muted text-xs">${r.merchant || r.pattern}</td>
        `;
        tbody.appendChild(row);
      });
    }

    async function handleAddNewRule(e) {
      e.preventDefault();
      const pattern = document.getElementById('new-rule-pattern').value.trim();
      const category = document.getElementById('new-rule-category').value;
      const merchant = document.getElementById('new-rule-merchant').value.trim();

      if (!pattern) return;

      try {
        const res = await fetch('/api/custom-rules', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pattern, category, merchant, workspace: AppState.activeWorkspace || 'default' })
        });
        const json = await res.json();
        if (json.status === 'ok') {
          document.getElementById('new-rule-pattern').value = '';
          document.getElementById('new-rule-merchant').value = '';
          loadDashboardData();
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function triggerOllamaReclassify() {
      if (!confirm("Lancer la catégorisation intelligente locale avec le modèle Ollama (qwen2.5:7b) ?")) return;
      try {
        const res = await fetch('/api/reclassify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ workspace: AppState.activeWorkspace || 'default' })
        });
        const json = await res.json();
        if (json.status === 'ok') {
          loadDashboardData();
        }
      } catch (err) {
        console.error(err);
      }
    }

    function toggleMobileMenu() {
      const nav = document.getElementById('sidebar-nav');
      if (nav) nav.classList.toggle('hidden');
    }

    // Initial Startup
    window.addEventListener('DOMContentLoaded', () => {
      if (AppState.currentView && AppState.currentView !== 'overview') {
        switchView(AppState.currentView);
      }
      loadDashboardData();
    });
  </script>
