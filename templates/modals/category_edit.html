  <div id="category-edit-modal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl border border-[#EAEAE5] shadow-2xl max-w-md w-full p-6 space-y-5 animate-in fade-in zoom-in-95 duration-150">
      
      <div class="flex items-center justify-between border-b border-[#EAEAE5] pb-3">
        <h3 class="font-serif-title text-xl text-century-charcoal">Modifier la catégorie</h3>
        <button onclick="closeCategoryModal()" class="text-century-muted hover:text-century-charcoal">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <span class="text-century-muted block">Opération sélectionnée</span>
          <p id="modal-tx-desc" class="font-semibold text-century-charcoal text-sm mt-0.5"></p>
          <p id="modal-tx-meta" class="text-century-muted font-mono mt-0.5"></p>
        </div>

        <div>
          <label class="block font-medium text-century-charcoal mb-1">Nouvelle Catégorie</label>
          <select id="modal-category-select" class="w-full px-3 py-2 rounded-lg bg-[#FAF9F6] border border-[#EAEAE5] text-xs text-century-charcoal focus:outline-none focus:border-[#2D5A3C]">
            <!-- Injected options -->
          </select>
        </div>

        <div class="pt-2 border-t border-[#EAEAE5] space-y-2">
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" id="modal-remember-rule" class="rounded border-[#D2D4CA] text-[#2D5A3C] focus:ring-[#2D5A3C]">
            <span class="font-medium text-century-charcoal">Mémoriser cette règle pour les futurs relevés</span>
          </label>
          <div id="modal-rule-input-box" class="pl-6 space-y-1">
            <label class="block text-[11px] text-century-muted">Mot-clé à appliquer systématiquement :</label>
            <input type="text" id="modal-rule-keyword" placeholder="ex: SOBRIO, UBER EATS..." class="w-full px-2.5 py-1.5 rounded-lg bg-[#FAF9F6] border border-[#EAEAE5] text-xs text-century-charcoal">
          </div>
        </div>
      </div>

      <div class="flex items-center justify-end space-x-2 pt-2 border-t border-[#EAEAE5]">
        <button onclick="closeCategoryModal()" class="px-4 py-2 rounded-lg border border-[#EAEAE5] text-xs font-medium text-century-charcoal hover:bg-[#F6F6F2] transition">
          Annuler
        </button>
        <button onclick="saveCategoryModalChange()" class="px-4 py-2 rounded-lg bg-[#2D5A3C] text-white text-xs font-medium hover:bg-[#234B34] transition shadow-sm">
          Enregistrer
        </button>
      </div>

    </div>
  </div>
