  <!-- Modal: Assign Transactions to Holiday Trip -->
  <div id="holiday-assign-modal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl border border-[#EAEAE5] shadow-2xl max-w-2xl w-full p-6 space-y-4 animate-in fade-in zoom-in-95 duration-150 max-h-[90vh] flex flex-col">
      
      <!-- Header -->
      <div class="flex items-center justify-between border-b border-[#EAEAE5] pb-3 shrink-0">
        <div>
          <h3 id="holiday-assign-modal-title" class="font-serif-title text-xl text-century-charcoal">Associer des dépenses au séjour</h3>
          <p id="holiday-assign-modal-sub" class="text-xs text-century-muted mt-0.5">Sélectionnez les opérations à rattacher à ce voyage</p>
        </div>
        <button onclick="closeHolidayAssignModal()" class="text-century-muted hover:text-century-charcoal">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Search & Filters -->
      <div class="flex items-center gap-2.5 shrink-0">
        <div class="relative flex-1">
          <svg class="w-4 h-4 text-century-muted absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="text" id="holiday-assign-search" oninput="filterHolidayAssignTransactions()" placeholder="Rechercher une opération (commerçant, libellé, montant...)" class="w-full pl-9 pr-3 py-1.5 rounded-lg bg-[#FAF9F6] border border-[#EAEAE5] text-xs text-century-charcoal focus:outline-none focus:border-[#2D5A3C]">
        </div>
        <select id="holiday-assign-cat-filter" onchange="filterHolidayAssignTransactions()" class="w-48 px-2.5 py-1.5 rounded-lg bg-[#FAF9F6] border border-[#EAEAE5] text-xs text-century-charcoal focus:outline-none focus:border-[#2D5A3C]">
          <option value="ALL">Toutes les catégories</option>
        </select>
      </div>

      <!-- Selection quick stats -->
      <div class="flex items-center justify-between text-xs text-century-muted px-1 shrink-0">
        <span id="holiday-assign-stats">0 opération(s) sélectionnée(s)</span>
        <button type="button" onclick="toggleAllHolidayAssignTx()" class="text-[#2D5A3C] font-semibold hover:underline">
          Tout sélectionner / Tout désélectionner
        </button>
      </div>

      <!-- Transactions List (Scrollable) -->
      <div class="border border-[#EAEAE5] rounded-xl overflow-hidden flex-1 overflow-y-auto min-h-[250px]">
        <table class="w-full text-left text-xs">
          <thead class="sticky top-0 bg-[#FAF9F5] border-b border-[#EAEAE5] text-[#6C7570] font-semibold">
            <tr>
              <th class="py-2.5 px-3 w-10 text-center">✓</th>
              <th class="py-2.5 px-3">Date</th>
              <th class="py-2.5 px-3">Commerçant / Libellé</th>
              <th class="py-2.5 px-3">Catégorie</th>
              <th class="py-2.5 px-3 text-right">Montant</th>
            </tr>
          </thead>
          <tbody id="holiday-assign-tbody" class="divide-y divide-[#EAEAE5]/60 font-sans">
            <!-- Dynamically populated -->
          </tbody>
        </table>
      </div>

      <!-- Footer -->
      <div class="flex items-center justify-end space-x-2 pt-3 border-t border-[#EAEAE5] shrink-0">
        <button type="button" onclick="closeHolidayAssignModal()" class="px-4 py-2 rounded-lg border border-[#EAEAE5] text-xs font-medium text-century-charcoal hover:bg-[#F6F6F2] transition">
          Annuler
        </button>
        <button type="button" onclick="saveHolidayAssignSelection()" class="px-4 py-2 rounded-lg bg-[#2D5A3C] text-white text-xs font-semibold hover:bg-[#234B34] transition shadow-xs">
          Enregistrer la sélection
        </button>
      </div>

    </div>
  </div>
